<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#3f8f86">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>AADAmeet · Discussion Lab</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&family=Material+Icons+Round&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg:#ebe6dc;--panel:#fffdf9;--ink:#1e2629;--mute:#66747b;--line:rgba(30,38,41,.09);--acc:#2f7f75;--in:#fffdf9;--out:#d3ece2;--outk:#12302b;--shadow:0 8px 30px rgba(40,50,55,.14);--sat:env(safe-area-inset-top);--sab:env(safe-area-inset-bottom)}
[data-theme=dark]{--bg:#0e1417;--panel:#172025;--ink:#e8edef;--mute:#8d9ca5;--line:rgba(255,255,255,.08);--acc:#6bb8ab;--in:#202b32;--out:#235a52;--outk:#eaf6f3;--shadow:0 8px 30px rgba(0,0,0,.5)}
html,body{height:100%}
body{font:15px/1.5 Nunito,system-ui,sans-serif;background:var(--bg);color:var(--ink);overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.mi{font-family:'Material Icons Round';font-size:22px;line-height:1;font-weight:400;font-feature-settings:'liga';user-select:none}
.ib{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:var(--mute);flex:none}
.ib:hover{background:var(--line);color:var(--ink)}
/* login */
.login{height:100dvh;display:grid;place-items:center;padding:20px;overflow:auto}
.card{width:min(400px,100%);background:var(--panel);border-radius:34px;padding:34px 26px 26px;box-shadow:var(--shadow)}
.logo{width:64px;height:64px;border-radius:22px;background:var(--acc);color:#fff;display:grid;place-items:center;margin-bottom:18px;transform:rotate(-6deg)}
.logo .mi{font-size:32px}
h1{font-size:28px;font-weight:800;letter-spacing:-.5px;line-height:1.15}
.sub{color:var(--mute);margin:6px 0 22px}
label{display:block;font-size:13px;font-weight:700;color:var(--mute);margin-bottom:14px}
input:not([type=checkbox]){display:block;width:100%;margin-top:6px;padding:13px 16px;border-radius:18px;border:1.5px solid transparent;background:var(--bg);color:var(--ink);font:600 16px Nunito,sans-serif}
input:focus{outline:0;border-color:var(--acc)}
.chk{display:flex;gap:10px;align-items:center;font-weight:600;cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--acc)}
.pw{position:relative;display:block}.pw input{padding-right:50px}
.eye{position:absolute;right:5px;top:50%;margin-top:3px;transform:translateY(-50%)}
.bd{margin-left:auto;min-width:22px;height:22px;border-radius:11px;background:var(--acc);color:#fff;font:800 12px/22px Nunito;text-align:center;padding:0 6px}
.m{cursor:pointer}.m.cur{background:var(--line)}
.file{display:flex;align-items:center;gap:10px;margin:4px 0;padding:8px 10px;border-radius:16px;background:var(--line);min-width:230px}
.file>.mi{font-size:30px;color:var(--acc)}.file div{flex:1;min-width:0}.file b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file small{color:var(--mute);font-weight:600}.file button{padding:7px 14px;border-radius:99px;background:var(--acc);color:#fff;font-weight:800}
.rq{border-left:3px solid var(--acc);padding:2px 8px;margin:2px 0 4px;border-radius:6px;background:var(--line);font-size:13px;cursor:pointer}.rq b{display:block;color:var(--acc);font-size:12px}.rq span{display:block;max-height:2.9em;overflow:hidden;opacity:.85}
.tx.del{font-style:italic;color:var(--mute)}
.rx{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}.rx span{padding:1px 9px;border-radius:99px;background:var(--line);font-size:13px;font-weight:700;cursor:pointer}.rx span.mine{background:var(--acc);color:#fff}
.mn{color:var(--acc);font-weight:800}.mn.me{background:rgba(63,174,106,.2);border-radius:6px;padding:0 3px}
.pinbar{display:flex;align-items:center;gap:8px;padding:7px 14px;background:var(--panel);border-bottom:1px solid var(--line);font-size:13px;font-weight:600;cursor:pointer}.pinbar .mi{font-size:18px;color:var(--acc)}.pinbar span:last-child{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ctx{display:none;align-items:center;gap:8px;margin:0 12px 6px;padding:4px 4px 4px 14px;border-radius:18px;background:var(--panel);font-size:13px;font-weight:600}.ctx.on{display:flex}.ctx div{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mnb{display:flex;gap:6px;padding:0 12px 6px;overflow-x:auto}.mnb button{padding:5px 12px;border-radius:99px;background:var(--panel);font-weight:700;flex:none}
.opts{display:grid;gap:6px}.opts button{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:var(--bg);font-weight:700;text-align:left}
.opts span:last-child{min-width:0;overflow:hidden;text-overflow:ellipsis}
.ems{display:flex;justify-content:space-between;margin-bottom:10px}.ems button{font-size:25px;width:46px;height:46px;border-radius:50%;background:var(--bg)}
.pbg{position:fixed;inset:0;z-index:60;background:rgba(10,15,18,.5);backdrop-filter:blur(6px);animation:fade .15s}
@keyframes fade{from{opacity:0}}
.row.lift{position:relative;z-index:61;animation:none}
.ppill,.pmenu{position:fixed;z-index:62;background:var(--panel);box-shadow:var(--shadow);animation:zoom .18s cubic-bezier(.2,.9,.3,1)}
@keyframes zoom{from{opacity:0;transform:scale(.86)}}
.ppill{display:flex;gap:2px;padding:6px;border-radius:99px}
.ppill button{width:44px;height:44px;border-radius:50%;font-size:26px;line-height:1;transition:transform .12s}
.ppill button:active{transform:scale(1.28)}.ppill button.mine{background:var(--out)}
.pmenu{width:min(250px,calc(100vw - 24px));border-radius:26px;padding:6px}
.pmenu button{display:flex;align-items:center;gap:12px;width:100%;padding:8px 10px;border-radius:20px;font-weight:700;text-align:left}
.pmenu button:active{background:var(--line)}
.pmenu button .mi{width:34px;height:34px;border-radius:13px;background:var(--bg);color:var(--acc);display:grid;place-items:center;font-size:20px}
.pmenu button.danger{color:#c0392b}.pmenu button.danger .mi{color:#c0392b;background:rgba(192,57,43,.12)}
.err{color:#c0392b;font-weight:700;font-size:13.5px;min-height:20px;margin-bottom:8px}
.cta{width:100%;padding:14px;border-radius:99px;background:var(--acc);color:#fff;font-weight:800;font-size:16px}
.cta:disabled{opacity:.6}
.fine{margin-top:16px;text-align:center;font-size:12.5px;color:var(--mute)}
/* chat-type chooser */
.pick .card{padding-bottom:22px}
.pick .sub{margin-bottom:18px}
.pk{display:flex;align-items:center;gap:14px;width:100%;padding:12px 14px;margin-bottom:10px;border-radius:24px;background:var(--bg);text-align:left;transition:transform .12s}
.pk:active{transform:scale(.98)}
.pk:hover{box-shadow:inset 0 0 0 1.5px var(--acc)}
.pk>.mi{width:48px;height:48px;border-radius:17px;background:var(--acc);color:#fff;display:grid;place-items:center;font-size:25px;flex:none}
.pk>.av{width:48px;height:48px;font-size:18px}
.pk.on>.av::after{content:"";position:absolute;right:-1px;bottom:-1px;width:12px;height:12px;border-radius:50%;background:#3fae6a;border:2.5px solid var(--bg)}
.pk.off{opacity:.6}
.pk>span:not(.mi){flex:1;min-width:0;font-weight:800;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pk small{display:block;color:var(--mute);font-weight:600;font-size:12.5px;white-space:normal}
.plist{max-height:44dvh;overflow:auto;margin:0 -4px;padding:0 4px}
.pback{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;margin-top:4px;padding:11px;border-radius:99px;font-weight:800;color:var(--mute)}
.pback:hover{background:var(--line);color:var(--ink)}
.sh .ib{margin-left:auto}
.pkgap{display:none}
@media(max-width:899px){
html,body{overscroll-behavior:none}
.pick{padding:0;place-items:stretch;background:var(--bg)}
.pick .card{width:100%;border-radius:0;box-shadow:none;background:var(--bg);display:flex;flex-direction:column;padding:calc(40px + var(--sat)) 24px calc(24px + var(--sab));animation:fade .2s}
.pick .logo{width:72px;height:72px;border-radius:25px;margin-bottom:26px}
.pick .logo .mi{font-size:36px}
.pick h1{font-size:36px}
.pick .sub{font-size:16px;margin-bottom:22px}
.pkgap{display:block;flex:1}
.pk{padding:16px;border-radius:28px;background:var(--panel);box-shadow:0 1px 2px var(--line)}
.pk>.mi,.pk>.av{width:56px;height:56px}
.pk>.mi{border-radius:20px;font-size:28px}
.pk>.av{font-size:20px}
.pk>span:not(.mi){font-size:18px}
.pk small{font-size:13.5px}
.pk.on>.av::after{border-color:var(--panel)}
.plist{flex:1;max-height:none;min-height:0}
.pback{margin-top:8px;padding:14px}
.app.on{animation:fade .2s}
.login{padding:0;place-items:stretch;background:var(--bg)}
.login .card{width:100%;border-radius:0;box-shadow:none;background:var(--bg);display:flex;flex-direction:column;padding:calc(40px + var(--sat)) 24px calc(24px + var(--sab));animation:fade .2s}
.login .logo{width:72px;height:72px;border-radius:25px;margin-bottom:26px}
.login .logo .mi{font-size:36px}
.login h1{font-size:36px}
.login .sub{font-size:16px;margin-bottom:26px}
.login label{font-size:14px;margin-bottom:16px}
.login input:not([type=checkbox]){background:var(--panel);padding:16px 18px;border-radius:20px;box-shadow:0 1px 2px var(--line)}
.login .err{margin-top:auto;padding-top:8px}
.login .cta{padding:17px;font-size:17px}
.login .fine{margin-top:14px}}
@media(pointer:coarse){.b{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}.b pre,.b code{-webkit-user-select:text;user-select:text}}
/* app */
.app{display:none;height:100dvh;max-width:1180px;margin:0 auto}
.app.on{display:flex}
.side{width:300px;flex:none;background:var(--panel);display:flex;flex-direction:column;border-right:1px solid var(--line)}
.sh{padding:calc(18px + var(--sat)) 20px 10px;display:flex;align-items:center;gap:12px}
.sh .logo{width:40px;height:40px;border-radius:14px;margin:0}.sh .logo .mi{font-size:22px}
.sh b{font-size:17px;display:block;line-height:1.2}.sh small{color:var(--mute);font-size:12.5px}
.mem{flex:1;overflow:auto;padding:6px 10px}
.m{display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:18px}
.m:hover{background:var(--line)}.m.off{opacity:.55}
.m span{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.m small{display:block;color:var(--mute);font-weight:600;font-size:12px}
.av{width:34px;height:34px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;font-weight:800;font-size:14px;position:relative}
.av.ghost{background:none!important}
.m .av{width:42px;height:42px}
.m.on .av::after{content:"";position:absolute;right:-1px;bottom:-1px;width:12px;height:12px;border-radius:50%;background:#3fae6a;border:2.5px solid var(--panel)}
.sf{padding:10px 12px calc(12px + var(--sab));display:flex;gap:6px;border-top:1px solid var(--line)}
.sf button{flex:1;display:flex;gap:8px;align-items:center;justify-content:center;padding:10px;border-radius:99px;background:var(--bg);font-weight:700;font-size:13.5px}
.main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative;background:var(--bg)}
.top{display:flex;align-items:center;gap:6px;padding:calc(8px + var(--sat)) 10px 8px 14px;background:var(--panel);border-bottom:1px solid var(--line)}
.ttl{flex:1;min-width:0}.ttl b{font-size:17px;display:block;line-height:1.25}
.ttl small{color:var(--mute);font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:#b9a27a;flex:none}.dot.ok{background:#3fae6a}
.only-m{display:none}
.msgs{flex:1;overflow-y:auto;padding:12px 14px 6px;overscroll-behavior:contain}
.day{width:max-content;margin:14px auto 8px;padding:3px 14px;border-radius:99px;background:var(--panel);color:var(--mute);font-size:12px;font-weight:700}
.sys{text-align:center;color:var(--mute);font-size:12.5px;font-weight:600;margin:8px 0}
.empty{text-align:center;color:var(--mute);margin:12vh auto 0;max-width:260px}
.empty .mi{font-size:44px;color:var(--acc);display:block;margin-bottom:6px}
.row{display:flex;align-items:flex-end;gap:8px;margin-top:2px;animation:pop .18s ease-out}
.row.first{margin-top:10px}.row.me{justify-content:flex-end}
@keyframes pop{from{opacity:0;transform:translateY(6px) scale(.98)}}
.b{max-width:min(80%,580px);min-width:0;padding:7px 13px 6px;border-radius:22px;background:var(--in);box-shadow:0 1px 1px var(--line);overflow-wrap:anywhere}
.row:not(.me) .b{border-bottom-left-radius:7px}
.me .b{background:var(--out);color:var(--outk);border-bottom-right-radius:7px}
.nm{font-size:12.5px;font-weight:800}
.tx{white-space:pre-wrap}
.t{float:right;margin:7px 0 0 12px;font-size:11px;color:var(--mute)}
.b::after{content:"";display:block;clear:both}
.b a{color:var(--acc);font-weight:700}
code{font-family:'JetBrains Mono',monospace;font-size:.86em;background:var(--line);padding:1px 6px;border-radius:8px}
.code{margin:6px 0;border-radius:18px;overflow:hidden;background:#151b1f;color:#dce5e8;max-width:100%}
.ch{display:flex;justify-content:space-between;align-items:center;padding:6px 8px 6px 14px;background:#1d252a;color:#9fb0b8;font:700 12px 'JetBrains Mono',monospace}
.ch button{padding:4px 13px;border-radius:99px;background:rgba(255,255,255,.09);color:#dce5e8;font:800 12px Nunito;margin-left:6px}
.ch button[data-a=run]{background:var(--acc);color:#fff}
.code pre{padding:12px 14px;overflow:auto;max-height:300px;font:500 12.5px/1.65 'JetBrains Mono',monospace}
.typing{height:22px;padding:0 20px;font-size:12.5px;font-weight:700;color:var(--acc)}
.fab{position:absolute;right:16px;bottom:96px;width:44px;height:44px;border-radius:50%;background:var(--panel);box-shadow:var(--shadow);display:none;place-items:center;color:var(--acc)}
.fab.on{display:grid}
.fab i{position:absolute;top:-6px;right:-4px;min-width:20px;height:20px;border-radius:10px;background:var(--acc);color:#fff;font:800 11px/20px Nunito;text-align:center;padding:0 5px}
.comp{display:flex;gap:8px;align-items:flex-end;padding:4px 12px calc(10px + var(--sab))}
.field{flex:1;display:flex;align-items:flex-end;background:var(--panel);border-radius:26px;padding:3px 4px 3px 16px;box-shadow:0 1px 2px var(--line)}
.field textarea{flex:1;min-width:0;border:0;outline:0;resize:none;background:none;color:var(--ink);font:600 16px/1.45 Nunito,sans-serif;padding:10px 0;max-height:140px}
.field textarea::placeholder{color:var(--mute);font-weight:600}
.send{width:48px;height:48px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center;flex:none}
.send:active{transform:scale(.92)}
.bg{position:fixed;inset:0;background:rgba(10,15,18,.5);display:none;align-items:flex-end;justify-content:center;z-index:50}
.bg.on{display:flex}
.sheet{width:min(580px,100%);background:var(--panel);border-radius:30px 30px 0 0;padding:20px 20px calc(20px + var(--sab));animation:up .25s cubic-bezier(.2,.9,.3,1);max-height:90dvh;overflow:auto}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet h3{font-size:17px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.url{background:var(--bg);padding:10px 14px;border-radius:16px;font:500 12px 'JetBrains Mono',monospace;word-break:break-all;margin-bottom:12px}
.res{padding:12px 14px;border-radius:16px;margin-bottom:12px;font-weight:600}
.res.good{background:rgba(63,174,106,.15)}.res.bad{background:rgba(192,57,43,.14)}.res.warn{background:rgba(185,162,122,.2)}
.acts{display:flex;gap:8px}
.acts button{flex:1;padding:12px;border-radius:99px;background:var(--bg);font-weight:800}
.acts .p{background:var(--acc);color:#fff}
.pv{width:100%;height:55dvh;border:0;border-radius:18px;background:#fff}
.toast{position:fixed;left:50%;bottom:calc(90px + var(--sab));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-weight:700;font-size:13.5px;z-index:80;animation:pop .2s}
.scrim{display:none}
@media(min-width:900px){body{padding:20px}.app{height:calc(100dvh - 40px);border-radius:34px;overflow:hidden;box-shadow:var(--shadow)}.bg{align-items:center}.sheet{border-radius:30px}.toast{bottom:100px}}
@media(max-width:899px){
.only-m{display:grid}
.side{position:fixed;inset:0 auto 0 0;width:min(330px,86vw);z-index:40;transform:translateX(-105%);transition:transform .28s cubic-bezier(.2,.9,.3,1);border-radius:0 30px 30px 0;box-shadow:var(--shadow)}
.side.open{transform:none}
.scrim.on{display:block;position:fixed;inset:0;background:rgba(10,15,18,.45);z-index:35}
.b{max-width:86%}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
#vp{position:fixed;inset:0;z-index:60;background:#000;display:none;flex-direction:column;color:#fff}
#vp.on{display:flex}
#vp video{flex:1;min-height:0;width:100%;object-fit:contain;background:#000}
#vp .vb{position:absolute;left:0;right:0;display:flex;align-items:center;gap:8px;padding:10px 12px;transition:opacity .25s;top:0;padding-top:calc(10px + env(safe-area-inset-top,0px));background:linear-gradient(#000b,#0000)}
#vp .vb.bot{top:auto;bottom:0;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:linear-gradient(#0000,#000c)}
#vp.h .vb{opacity:0;pointer-events:none}
#vp button{background:#fff2;border:0;color:#fff;border-radius:999px;min-width:40px;height:40px;padding:0 12px;font:inherit;cursor:pointer}
#vp input[type=range]{flex:1;accent-color:#fff}
#vp .vt{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
#vp small{opacity:.85;white-space:nowrap}
#vl{display:none;position:absolute;top:64px;right:12px;width:min(300px,calc(100% - 24px));background:#000d;border-radius:14px;padding:10px;flex-direction:column;gap:8px}
#vl.on{display:flex}
#vl .vr2{display:flex;justify-content:space-between;align-items:center;gap:8px}
#vp[data-role=v] #vm{display:none}
</style>
</head>
<body>
<div class="login" id="login">
 <form class="card" id="form">
  <div class="logo"><span class="mi">forum</span></div>
  <h1>AADAmeet</h1>
  <p class="sub">A private lab for design talk, code and quick experiments.</p>
  <label>Your name<input id="dn" maxlength="24" autocomplete="nickname" placeholder="What should the lab call you?" required></label>
  <label>Username<input id="un" autocomplete="username" required></label>
  <label>Password<span class="pw"><input id="pw" type="password" autocomplete="current-password" required><button type="button" class="ib eye" id="eye" aria-label="Show password"><span class="mi">visibility</span></button></span></label>
  <label>Room key (optional)<input id="rk" type="password" autocomplete="off" placeholder="Shared secret to encrypt the group chat"></label>
  <label class="chk"><input type="checkbox" id="rm"> Remember my name and username</label>
  <p class="err" id="err" role="alert"></p>
  <button class="cta" id="go">Enter the lab</button>
  <p class="fine">Encrypted connection · your password is never saved</p>
 </form>
</div>

<div class="login pick" id="pick" style="display:none">
 <div class="card" id="pickc"></div>
</div>

<div class="app" id="app">
 <aside class="side" id="side">
  <div class="sh"><div class="logo"><span class="mi">forum</span></div><div><b>Discussion Lab</b><small id="cnt">0 online</small></div><button class="ib" id="home" aria-label="Change chat type" title="Change chat type"><span class="mi">swap_horiz</span></button></div>
  <div class="mem" id="mem"></div>
  <div class="sf">
   <button id="bell"><span class="mi">notifications_active</span>Alerts</button>
   <button id="theme"><span class="mi">dark_mode</span>Theme</button>
   <button id="leave"><span class="mi">logout</span>Leave</button>
  </div>
 </aside>
 <div class="scrim" id="scrim"></div>
 <main class="main">
  <header class="top">
   <button class="ib" id="back" aria-label="Back to chat types" title="Back"><span class="mi">arrow_back</span></button>

/* files, two modes (picked by size):
   STORED  up to CFG.fmax -> cut into CFG.fchunk binary pieces, each encrypted on its own (AES-GCM) and published retained on a fixed ring of CFG.slots topics
           owned by the sender (hall/file/<sender>/<slot>). The topic count never grows, newer files overwrite older pieces, and MQTT 5 expiry removes anything
           left over after CFG.fttl even if the sender never comes back. The receiver can be offline, and a broken download resumes piece by piece.
   DIRECT  above that -> device to device over WebRTC. Nothing is stored, so if it breaks it simply starts again. The broker only relays small encrypted signalling messages. */
const safeName=s=>String(s||'file').replace(/[\\/:*?"<>|\x00-\x1f]/g,'_').slice(0,80)||'file';
const fmtSize=n=>n<1024?n+' B':n<1048576?(n/1024).toFixed(1)+' KB':n<1073741824?(n/1048576).toFixed(2)+' MB':(n/1073741824).toFixed(2)+' GB';
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const R={};
const ownerOf=id=>id.slice(0,id.lastIndexOf('-'));
const slotOf=(m,i)=>(m.a+i)%CFG.slots;
const slotTopic=(owner,slot)=>CFG.file+owner+'/'+slot;
const rtcCfg=()=>({iceServers:CFG.ice.concat(CFG.turn)});
/*FT-CODEC-START*/
/* piece format (binary, no base64): encrypted = iv(12) + AES-GCM ciphertext/tag, bound to "<file id>:<index>" so a piece cannot be swapped between files or positions.
   Without a key = sha256("<id>:<index>"+bytes)(32) + bytes, so a damaged or replaced piece is still caught (header stays zero when SubtleCrypto is unavailable). */
const aadOf=(id,i)=>te.encode(id+':'+i);
async function encBin(k,u8,a){const iv=crypto.getRandomValues(new Uint8Array(12)),c=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv,additionalData:a},k,u8)),o=new Uint8Array(12+c.length);o.set(iv);o.set(c,12);return o}
async function decBin(k,u,a){return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:u.subarray(0,12),additionalData:a},k,u.subarray(12)))}
const zero32=u=>{for(let i=0;i<32;i++)if(u[i])return false;return true};
const tagged=(a,b)=>{const m=new Uint8Array(a.length+b.length);m.set(a);m.set(b,a.length);return m};
async function sealChunk(key,u8,id,i){
 const a=aadOf(id,i);
 if(key)return encBin(key,u8,a);
 const o=new Uint8Array(32+u8.length);o.set(u8,32);
 if(crypto.subtle)o.set(new Uint8Array(await crypto.subtle.digest('SHA-256',tagged(a,u8))));
 return o}
async function openChunk(key,u,id,i){
 const a=aadOf(id,i);
 if(key)return decBin(key,u,a);
 if(u.length<32)throw 0;
 const b=u.subarray(32);
 if(crypto.subtle&&!zero32(u)){const h=new Uint8Array(await crypto.subtle.digest('SHA-256',tagged(a,b)));for(let j=0;j<32;j++)if(h[j]!==u[j])throw 0}
 return b}
const storedOk=m=>!!m&&m.v===2&&Number.isInteger(m.c)&&m.c>=65536&&m.c<=CFG.fchunk&&Number.isInteger(m.a)&&m.a>=0&&m.a<=Number.MAX_SAFE_INTEGER&&m.size>0&&m.size<=CFG.fmax&&m.n===Math.ceil(m.size/m.c)&&m.n<=CFG.slots/2;
/*FT-CODEC-END*/
/* ring position: an ever-growing counter kept on this device; slot = (counter + piece index) mod CFG.slots */
const ringNow=()=>S.get('fabs',0);
const ringAlloc=n=>{const a=ringNow();S.set('fabs',a+n);return a};
/* only the owner clears, and only while no newer file has wrapped round onto these slots */
function clearSlots(fm){
 if(!client?.connected||fm.v!==2||!String(fm.id).startsWith(myId+'-')||!Number.isInteger(fm.a)||!(fm.n>0&&fm.n<=CFG.slots/2))return;
 if(ringNow()-fm.a>CFG.slots)return;
 for(let i=0;i<fm.n;i++)client.publish(slotTopic(myId,slotOf(fm,i)),'',{qos:1,retain:true})}

function fqSweep(){if(!client?.connected)return;const q=S.get('fq',[]);if(!q.length)return;
 q.forEach(e=>{if(/^[\w-]+$/.test(e.id||'')&&/^[\w-]+$/.test(e.to||''))for(let i=0;i<Math.min(+e.n||0,64);i++)client.publish('hall/file/'+e.to+'/'+e.id+'/'+i,'',{qos:1,retain:true})});S.del('fq')}
function longAsFile(v){if(confirm('That message is over '+CFG.max+' characters. Send it as a text file instead?'))sendFile(new File([v],'snippet.txt',{type:'text/plain'}))}
const online=ms=>new Promise(ok=>{const t=Date.now(),iv=setInterval(()=>{if(client?.connected||Date.now()-t>ms){clearInterval(iv);ok(!!client?.connected)}},250)});
/* one piece: waits for a connection, gives up after 90 s per try, retries with backoff, stops at once on a broker quota / size refusal */
async function upload(topic,pl){
 for(let a=0;;a++){
  if(!client?.connected&&!await online(30000))throw new Error('offline');
  try{await new Promise((ok,no)=>{const t=setTimeout(()=>no(new Error('timeout')),90000);
    client.publish(topic,pl,{qos:1,retain:true,properties:{messageExpiryInterval:CFG.fttl}},e=>{clearTimeout(t);e?no(e):ok()})});return}
  catch(e){if(a>=4||e?.code===151||e?.code===149)throw e;await sleep(700*2**a)}}}

const vstate=()=>({p:vid.paused,m:vid.currentTime,h:Date.now()});
function vBcast(s){const m={t:'st',...vstate()};Object.values(s.v).forEach(p=>vsend(p.ctl,m))}
function vDrop(s,id){const p=s.v[id];if(!p)return;delete s.v[id];try{p.ctl.close()}catch{}try{p.pc.close()}catch{}vList(s);vWait(s)}
/* if any viewer is still buffering the host pauses for everyone and resumes when all are ready */
function vWait(s){if(s!==VCUR)return;const w=Object.values(s.v).some(p=>p.buf);if(w&&!vid.paused){s.auto=1;vid.pause()}else if(!w&&s.auto){s.auto=0;vid.play().catch(()=>{})}}
function vHostMsg(s,pv,m){
 if(m.t==='get'&&Array.isArray(m.i)){const ok=m.i.filter(i=>Number.isInteger(i)&&i>=0&&i<s.n&&!pv.q.includes(i)&&i!==pv.cur);pv.q=m.f?ok.concat(pv.q):pv.q.concat(ok);pv.q.length=Math.min(pv.q.length,16);vServe(s,pv)}
 else if(m.t==='cancel')pv.q=[];
 else if(m.t==='ping')vsend(pv.ctl,{t:'pong',c:m.c,h:Date.now()});
 else if(m.t==='buf'){pv.buf=m.b?1:0;vWait(s);vList(s)}}
async function vServe(s,pv){
 if(pv.busy)return;pv.busy=1;
 try{const CH=Math.max(16384,Math.min(65536,pv.pc.sctp?.maxMessageSize||16384))-8;
  while(pv.q.length&&pv.bulk.readyState==='open'){
   const i=pv.cur=pv.q.shift(),b=new Uint8Array(await s.file.slice(i*VPS,(i+1)*VPS).arrayBuffer());
   pv.bulk.send(JSON.stringify({i,h:vhex(await crypto.subtle.digest('SHA-256',b))}));
   for(let o=0;o<b.length;o+=CH){
    if(pv.bulk.bufferedAmount>4194304&&await drain(pv.bulk)!=='ok')return;
    const f=new Uint8Array(8+Math.min(CH,b.length-o)),dv=new DataView(f.buffer);dv.setUint32(0,i);dv.setUint32(4,o);f.set(b.subarray(o,o+CH),8);pv.bulk.send(f)}}}
 catch{}finally{pv.busy=0;pv.cur=-1}}
async function vJoin(m){
 if(VW||VCUR)vLeave();
 const host=m.id.slice(1,m.id.lastIndexOf('-'));if(!window.RTCPeerConnection)return toast('This browser cannot stream.');
 const w=VW={m,host,sid:m.id,n:Math.ceil(m.size/VPS),p:{},got:0,reads:[],off:0,rtt:1e9,bytes:0,fb:true,fly:{},tries:0,last:Date.now()};
 try{if(navigator.serviceWorker&&window.isSecureContext){
  if(!vJoin.l){vJoin.l=1;navigator.serviceWorker.addEventListener('message',vRead)}
  await navigator.serviceWorker.register('./sw.js');await navigator.serviceWorker.ready;
  if(!navigator.serviceWorker.controller)await new Promise(r=>{navigator.serviceWorker.addEventListener('controllerchange',r,{once:true});setTimeout(r,1500)});
  w.fb=!navigator.serviceWorker.controller}}catch{}
 if(VW!==w)return;
 vOpen(m.id,1);rtcSend(host,{k:'vreq',f:m.id,g:m.g});
 w.to=setTimeout(()=>{if(VW===w&&!w.ctl){toast('No answer. The host must be online.');vLeave()}},30000);
 w.iv=setInterval(()=>{vsend(w.ctl,{t:'ping',c:Date.now()});if(w.ctl&&Date.now()-w.last>15000)vRejoin(w);vApply();vSchedule();vUI()},2000)}
/* a dropped link is retried up to 6 times with growing pauses; pieces already downloaded are kept, so playback carries on from the buffer meanwhile */
function vRejoin(w){if(VW!==w)return;clearTimeout(w.to);try{w.pc?.close()}catch{}w.pc=w.ctl=w.bulk=w.cur=null;w.fly={};
 if(++w.tries>6){toast('Lost the connection to the host.');return vLeave()}
 $('#vs').textContent='Reconnecting…';
 setTimeout(()=>{if(VW===w){rtcSend(w.host,{k:'vreq',f:w.sid,g:w.m.g});w.last=Date.now();w.to=setTimeout(()=>vRejoin(w),20000)}},1000*w.tries)}
async function vAnswer(from,d,pl){
 const w=VW;if(!w||w.sid!==d.f||w.host!==from||!pl||w.pc)return;
 const pc=w.pc=new RTCPeerConnection(rtcCfg());
 pc.onconnectionstatechange=()=>{if(pc.connectionState==='failed')vRejoin(w)};
 pc.ondatachannel=e=>{const c=e.channel;
  if(c.label==='c'){w.ctl=c;c.onmessage=ev=>{let m;try{m=JSON.parse(ev.data)}catch{return}vViewerMsg(w,m)};c.onclose=()=>{if(w.ctl===c)vRejoin(w)}}
  else{c.binaryType='arraybuffer';w.bulk=c;c.onmessage=ev=>vFrame(w,ev.data)}};
 try{await pc.setRemoteDescription(pl);await pc.setLocalDescription(await pc.createAnswer());await gathered(pc);rtcSend(from,{k:'vanswer',f:d.f,g:w.m.g},pc.localDescription.toJSON())}catch{toast('Could not connect.');vLeave()}}
function vViewerMsg(w,m){
 if(m.t==='hi'){clearTimeout(w.to);w.tries=0;w.last=Date.now();for(let k=0;k<5;k++)setTimeout(()=>vsend(w.ctl,{t:'ping',c:Date.now()}),k*250);w.st=m.st;vSchedule();vApply()}
 else if(m.t==='pong'){w.last=Date.now();const r=Date.now()-m.c;if(r<w.rtt){w.rtt=r;w.off=m.h+r/2-Date.now()}}
 else if(m.t==='st'){w.st=m;vApply()}}
/* what the host's player should show right now, then gently pull ours onto it: ignore under 0.3 s, nudge the speed by 5% up to 2 s, seek beyond */
function vApply(){const w=VW,s=w?.st;if(!s||!vid.src&&!w.fb)return;if(!vid.src)return;
 const t=s.p?s.m:s.m+(Date.now()+w.off-s.h)/1000,d=t-vid.currentTime;
 if(s.p){if(!vid.paused)vid.pause();if(Math.abs(d)>.3)vid.currentTime=t;vid.playbackRate=1;return}
 if(vid.paused&&vid.readyState>=3)vid.play().catch(()=>{$('#vs').textContent='Tap the screen to play'});
 if(Math.abs(d)>2)vid.currentTime=t;else vid.playbackRate=Math.abs(d)>.3?(d>0?1.05:.95):1}
/* piece scheduler: first what a waiting range read needs, then 32 pieces ahead of the playhead, then the rest. Re-sent whole each time so a seek takes effect at once. */
function vSchedule(){const w=VW;if(!w?.ctl||w.ctl.readyState!=='open')return;
 const h=w.head||0,now=Date.now(),want=[],add=i=>{if(i>=0&&i<w.n&&!w.p[i]&&!want.includes(i))want.push(i)};
 w.reads.forEach(r=>{for(let i=r.a;i<=r.b;i++)add(i)});
 for(let i=h;i<Math.min(w.n,h+32);i++)add(i);
 for(let i=h;i<(w.fb?w.n:Math.min(w.n,h+160))&&want.length<8;i++)add(i);
 const fresh=want.slice(0,6).filter(i=>now-(w.fly[i]||0)>=20000);
 if(fresh.length){fresh.forEach(i=>w.fly[i]=now);vsend(w.ctl,{t:'get',i:fresh,f:w.reads.length?1:0})}
 if(!w.fb)for(const k in w.p)if(+k<h-32||+k>h+200){delete w.p[k];w.got--}}
async function vFrame(w,d){
 if(VW!==w)return;
 if(typeof d==='string'){const o=JSON.parse(d);w.cur={i:o.i,h:o.h,ch:[],n:0};return}
 const c=w.cur;if(!c)return;const i=new DataView(d).getUint32(0);if(i!==c.i)return;
 c.ch.push(new Uint8Array(d,8));c.n+=d.byteLength-8;if(c.n<vplen(w,i))return;w.cur=null;
 const b=new Blob(c.ch);
 if(b.size!==vplen(w,i)||vhex(await crypto.subtle.digest('SHA-256',await b.arrayBuffer()))!==c.h){delete w.fly[i];return vSchedule()}
 delete w.fly[i];w.last=Date.now();
 if(!w.p[i]){w.p[i]=b;w.got++;w.bytes+=b.size}
 vReads();vSchedule();vUI()}
function vRead(e){const{sid,start,end}=e.data||{},port=e.ports[0],w=VW;if(!port)return;
 if(!w||w.sid!==sid)return port.postMessage(null);
 const z=w.m.size,en=Math.min(end,z-1,start+4194303);
 if(start>=z)return port.postMessage({buf:new ArrayBuffer(0),size:z,type:w.m.type});
 if(Math.abs((start/VPS|0)-(w.head||0))>2){vsend(w.ctl,{t:'cancel'});w.fly={}}
 w.reads.push({start,end:en,a:start/VPS|0,b:en/VPS|0,port});w.head=start/VPS|0;vReads();vSchedule()}
function vReads(){const w=VW;if(!w)return;
 w.reads=w.reads.filter(r=>{for(let i=r.a;i<=r.b;i++)if(!w.p[i])return true;
  const bl=[];for(let i=r.a;i<=r.b;i++){const s=i*VPS;bl.push(w.p[i].slice(Math.max(r.start,s)-s,Math.min(r.end+1,s+VPS)-s))}
  new Blob(bl).arrayBuffer().then(buf=>r.port.postMessage({buf,size:w.m.size,type:w.m.type},[buf]));return false});
 if(w.fb&&w.got===w.n&&!w.done){w.done=1;vid.src=URL.createObjectURL(new Blob(Array.from({length:w.n},(_,i)=>w.p[i]),{type:w.m.type}));vApply()}}
function vUI(){const w=VW;if(!w)return;let a=0;for(let k=0;k<vid.buffered.length;k++)if(vid.buffered.start(k)<=vid.currentTime+.5&&vid.buffered.end(k)>vid.currentTime)a=vid.buffered.end(k)-vid.currentTime;
 $('#vs').textContent=w.ctl?Math.round(w.got/w.n*100)+'% downloaded'+(w.fb&&!w.done?' · plays when complete':' · '+Math.round(a)+'s ahead'):'Connecting…'}
function vList(s){const b=$('#vl');b.replaceChildren();if(s!==VCUR)return;
 const lk=document.createElement('button');lk.textContent=s.locked?'Unlock stream':'Lock stream (no new viewers)';lk.onclick=()=>{s.locked=!s.locked;vList(s)};b.append(lk);
 Object.entries(s.v).forEach(([id,p])=>{const r=el('vr2'),n=document.createElement('span');n.textContent=p.name+(p.buf?' · buffering':'');const k=document.createElement('button');k.textContent='Remove';k.onclick=()=>vDrop(s,id);r.append(n,k);b.append(r)});
 $('#vs').textContent=Object.keys(s.v).length+' watching'}
function vOpen(id,viewer){
 vpane.classList.add('on');vpane.dataset.role=viewer?'v':'h';$('#vl').classList.remove('on');$('#vr').disabled=!!viewer;
 if(!vkeep){vkeep=1;keepAwake(true)}
 vid.playbackRate=1;
 if(viewer){$('#vt').textContent=VW.m.name;$('#vs').textContent='Connecting…';if(!VW.fb)vid.src=new URL('vstream/'+id,location.href).href}
 else{const s=VCUR=VS[id];$('#vt').textContent=s.m.name;vid.src=URL.createObjectURL(s.file);s.iv=setInterval(()=>vBcast(s),2000);vList(s)}
 vShow()}
function vLeave(){
 const w=VW,s=VCUR;VW=null;VCUR=null;
 if(w){clearTimeout(w.to);clearInterval(w.iv);w.reads.forEach(r=>r.port.postMessage(null));try{w.pc?.close()}catch{}}
 if(s){clearInterval(s.iv);Object.keys(s.v).forEach(k=>vDrop(s,k));delete VS[s.m.id]}
 vid.pause();vid.removeAttribute('src');vid.load();vpane.classList.remove('on');
 if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});
 if(vkeep){vkeep=0;keepAwake(false)}}
function vShow(){vpane.classList.remove('h');clearTimeout(vht);vht=setTimeout(()=>{if(!vid.paused||VW)vpane.classList.add('h')},3500)}
function vTime(){const d=vid.duration||0;$('#vr').value=d?vid.currentTime/d*1000:0;$('#vc').textContent=vfmt(vid.currentTime)+' / '+vfmt(d)}
['play','pause','seeked','ratechange'].forEach(ev=>vid.addEventListener(ev,()=>{if(VCUR)vBcast(VCUR);vTime()}));
vid.addEventListener('timeupdate',vTime);
vid.addEventListener('waiting',()=>vsend(VW?.ctl,{t:'buf',b:1}));
['playing','canplay'].forEach(ev=>vid.addEventListener(ev,()=>vsend(VW?.ctl,{t:'buf',b:0})));
vid.onclick=()=>{if(VW&&vid.paused&&VW.st&&!VW.st.p)vid.play().catch(()=>{});vpane.classList.contains('h')?vShow():vpane.classList.add('h')};
vpane.addEventListener('pointermove',vShow);
$('#vx').onclick=()=>vLeave();
$('#vm').onclick=()=>$('#vl').classList.toggle('on');
$('#vpp').onclick=()=>{if(VCUR)vid.paused?vid.play():vid.pause();else vApply()};
$('#vr').oninput=()=>{if(VCUR&&vid.duration)vid.currentTime=$('#vr').value/1000*vid.duration};
$('#vpi').onclick=async()=>{try{if(document.pictureInPictureElement)await document.exitPictureInPicture();else if(vid.requestPictureInPicture)await vid.requestPictureInPicture();else vid.webkitSetPresentationMode('picture-in-picture')}catch{toast('Picture-in-picture is not available here.')}};
$('#vfs').onclick=async()=>{try{if(document.fullscreenElement){await document.exitFullscreen();screen.orientation.unlock()}else if(vpane.requestFullscreen){await vpane.requestFullscreen();try{await screen.orientation.lock('landscape')}catch{}}else vid.webkitEnterFullscreen()}catch{}};
window.addEventListener('beforeunload',e=>{if(VCUR){e.preventDefault();e.returnValue=''}});
$('#attach').onclick=()=>$('#fi').click();
$('#fi').onchange=e=>{const f=e.target.files[0];e.target.value='';if(f)sendFile(f)};
const mainEl=document.querySelector('.main');mainEl.ondragover=e=>e.preventDefault();
mainEl.ondrop=e=>{e.preventDefault();const f=e.dataTransfer.files[0];if(f)sendFile(f)};
function flush(){
 ready=true;const dn={};backlog.sort((a,b)=>a.timestamp-b.timestamp).forEach(m=>{m.th=m.th||'lab';store(m);
  if(m.th===cur)add(m,m.userId===myId);else if(m.th!=='lab'){unr[m.th]=(unr[m.th]||0)+1;dn[m.th]=m}});
 backlog=[];Object.values(dn).forEach(notify);renderMembers();
 if(skipped)sys(`${skipped} earlier message${skipped>1?'s are':' is'} encrypted with a different room key`);skipped=0}
function saveCred(){if(lastCred&&window.PasswordCredential)navigator.credentials.store(new PasswordCredential({id:lastCred.u,password:lastCred.p,name:lastCred.n})).catch(()=>{});lastCred=null}
function openThread(id){
 cur=id;setCtx(null);unr[id]=0;list.replaceChildren();lastDay='';last=null;
 $('#tt').textContent=id==='lab'?'Discussion Lab':(users.get(id)?.name||'Private chat');
 input.placeholder=id==='lab'?'Share an idea, critique or snippet…':'Private message…';
 hist.filter(m=>(m.th||'lab')===id).forEach(m=>add(m,m.userId===myId,true));
 if(!list.children.length)empty();toBottom();showTyping();showPins();renderMembers();drawer(false)}

/* sheets */
function preview(lang,code){
 const l=lang.toLowerCase(),doc=l==='css'?`<style>${code}</style><div class="demo">CSS preview</div>`:/^(js|javascript)$/.test(l)?`<div id="vp"><video id="vv" playsinline></video><div class="vb"><button id="vx"><span class="mi">close</span></button><span class="vt" id="vt"></span><small id="vs"></small><button id="vm"><span class="mi">group</span></button></div><div class="vb bot"><button id="vpp"><span class="mi">play_arrow</span></button><input type="range" id="vr" min="0" max="1000" value="0"><small id="vc">0:00</small><button id="vpi"><span class="mi">picture_in_picture_alt</span></button><button id="vfs"><span class="mi">fullscreen</span></button></div><div id="vl"></div></div>
<script>${code}<\/script>`:/<html|<!doctype/i.test(code)?code:code;
 const f=document.createElement('iframe');f.className='pv';f.sandbox='allow-scripts';f.srcdoc=`<meta name="viewport" content="width=device-width,initial-scale=1"><body style="margin:14px;font-family:system-ui,sans-serif">${doc}`;
 sheet('Live preview',f)}
async function linkSheet(u){
 if(!/^https?:\/\//i.test(u))return;
 const w=el(),url=el('url',u),res=el('res warn','Checking this link…'),acts=el('acts');w.append(url,res,acts);sheet('Link safety',w);
 const go=()=>{window.open(u,'_blank','noopener,noreferrer');closeSheet()};
 const btns=(open,label)=>{acts.replaceChildren();const c=document.createElement('button');c.textContent='Cancel';c.onclick=closeSheet;acts.append(c);if(open){const o=document.createElement('button');o.className='p';o.textContent=label;o.onclick=go;acts.append(o)}};
 btns(false);
 try{const ac=new AbortController(),t=setTimeout(()=>ac.abort(),9000);
  const r=await fetch(CFG.api,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:u}),signal:ac.signal});clearTimeout(t);
  if(!r.ok)throw 0;const d=await r.json(),ok=d.status==='safe'||d.status==='clean';
  res.className='res '+(ok?'good':'bad');res.textContent=ok?'No threats found. This link looks safe.':'This link may be unsafe. Opening it is not recommended.';btns(ok,'Open link')}
 catch{res.className='res warn';res.textContent='We could not verify this link. Open it only if you trust the sender.';btns(true,'Open anyway')}}

/* alerts */
let unreadN=0;const base=document.title;
const setUnread=n=>{unreadN=n;document.title=n?`(${n}) ${base}`:base};
document.addEventListener('visibilitychange',()=>{if(!document.hidden){setUnread(0);if(client?.connected)pub('online')}});
addEventListener('focus',()=>setUnread(0));
function chime(){try{actx=actx||new(window.AudioContext||window.webkitAudioContext)();actx.resume?.();const n=actx.currentTime;[[660,0],[880,.12]].forEach(([f,d])=>{const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=f;o.connect(g);g.connect(actx.destination);g.gain.setValueAtTime(0,n+d);g.gain.linearRampToValueAtTime(.07,n+d+.01);g.gain.exponentialRampToValueAtTime(.001,n+d+.22);o.start(n+d);o.stop(n+d+.24)})}catch{}}
function notify(m){const hidden=document.hidden||!document.hasFocus();if(hidden)setUnread(unreadN+1);if(!notif)return;chime();
 if(hidden&&'Notification'in window&&Notification.permission==='granted'){try{new Notification(m.name+(mentioned(m.message)?' mentioned you':''),{body:m.message.startsWith('::file::')?'Sent a file':m.message.slice(0,90),tag:'aadameet',silent:true})}catch{}}}
const bellUI=()=>{$('#bell .mi').textContent=notif?'notifications_active':'notifications_off'};
$('#bell').onclick=async()=>{notif=!notif;S.set('notif',notif);bellUI();
 if(notif&&'Notification'in window&&Notification.permission==='default')await Notification.requestPermission();
 toast(notif?'Alerts on':'Alerts muted')};

/* chrome */
const side=$('#side'),scrim=$('#scrim');
const drawer=o=>{side.classList.toggle('open',o);scrim.classList.toggle('on',o)};
$('#menu').onclick=()=>drawer(true);scrim.onclick=()=>drawer(false);
$('#leave').onclick=()=>{navigator.credentials?.preventSilentAccess?.();pub('offline');setTimeout(()=>{try{client.end(true)}catch{}location.reload()},150)};
addEventListener('pagehide',()=>{if(client?.connected)pub('offline')});
if(window.visualViewport){const app=$('#app'),vv=visualViewport;const f=()=>{if(innerWidth<900){app.style.height=vv.height+'px';scrollTo(0,0)}};vv.addEventListener('resize',f)}
})();
