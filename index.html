<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#3f8f86">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>AADAmeet · Discussion Lab</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&family=Material+Icons+Round&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg:#ebe6dc;--panel:#fffdf9;--ink:#1e2629;--mute:#66747b;--line:rgba(30,38,41,.09);--acc:#2f7f75;--in:#fffdf9;--out:#d3ece2;--outk:#12302b;--shadow:0 8px 30px rgba(40,50,55,.14);--sat:env(safe-area-inset-top);--sab:env(safe-area-inset-bottom)}
[data-theme=dark]{--bg:#0e1417;--panel:#172025;--ink:#e8edef;--mute:#8d9ca5;--line:rgba(255,255,255,.08);--acc:#6bb8ab;--in:#202b32;--out:#235a52;--outk:#eaf6f3;--shadow:0 8px 30px rgba(0,0,0,.5)}
html,body{height:100%}
body{font:15px/1.5 Nunito,system-ui,sans-serif;background:var(--bg);color:var(--ink);overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.mi{font-family:'Material Icons Round';font-size:22px;line-height:1;font-weight:400;font-feature-settings:'liga';user-select:none}
.ib{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:var(--mute);flex:none}
.ib:hover{background:var(--line);color:var(--ink)}
/* login */
.login{height:100dvh;display:grid;place-items:center;padding:20px;overflow:auto}
.card{width:min(400px,100%);background:var(--panel);border-radius:34px;padding:34px 26px 26px;box-shadow:var(--shadow)}
.logo{width:64px;height:64px;border-radius:22px;background:var(--acc);color:#fff;display:grid;place-items:center;margin-bottom:18px;transform:rotate(-6deg)}
.logo .mi{font-size:32px}
h1{font-size:28px;font-weight:800;letter-spacing:-.5px;line-height:1.15}
.sub{color:var(--mute);margin:6px 0 22px}
label{display:block;font-size:13px;font-weight:700;color:var(--mute);margin-bottom:14px}
input:not([type=checkbox]){display:block;width:100%;margin-top:6px;padding:13px 16px;border-radius:18px;border:1.5px solid transparent;background:var(--bg);color:var(--ink);font:600 16px Nunito,sans-serif}
input:focus{outline:0;border-color:var(--acc)}
.chk{display:flex;gap:10px;align-items:center;font-weight:600;cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--acc)}
.pw{position:relative;display:block}.pw input{padding-right:50px}
.eye{position:absolute;right:5px;top:50%;margin-top:3px;transform:translateY(-50%)}
.bd{margin-left:auto;min-width:22px;height:22px;border-radius:11px;background:var(--acc);color:#fff;font:800 12px/22px Nunito;text-align:center;padding:0 6px}
.m{cursor:pointer}.m.cur{background:var(--line)}
.file{display:flex;align-items:center;gap:10px;margin:4px 0;padding:8px 10px;border-radius:16px;background:var(--line);min-width:230px}
.file>.mi{font-size:30px;color:var(--acc)}.file div{flex:1;min-width:0}.file b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file small{color:var(--mute);font-weight:600}.file button{padding:7px 14px;border-radius:99px;background:var(--acc);color:#fff;font-weight:800}
.rq{border-left:3px solid var(--acc);padding:2px 8px;margin:2px 0 4px;border-radius:6px;background:var(--line);font-size:13px;cursor:pointer}.rq b{display:block;color:var(--acc);font-size:12px}.rq span{display:block;max-height:2.9em;overflow:hidden;opacity:.85}
.tx.del{font-style:italic;color:var(--mute)}
.rx{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}.rx span{padding:1px 9px;border-radius:99px;background:var(--line);font-size:13px;font-weight:700;cursor:pointer}.rx span.mine{background:var(--acc);color:#fff}
.mn{color:var(--acc);font-weight:800}.mn.me{background:rgba(63,174,106,.2);border-radius:6px;padding:0 3px}
.pinbar{display:flex;align-items:center;gap:8px;padding:7px 14px;background:var(--panel);border-bottom:1px solid var(--line);font-size:13px;font-weight:600;cursor:pointer}.pinbar .mi{font-size:18px;color:var(--acc)}.pinbar span:last-child{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ctx{display:none;align-items:center;gap:8px;margin:0 12px 6px;padding:4px 4px 4px 14px;border-radius:18px;background:var(--panel);font-size:13px;font-weight:600}.ctx.on{display:flex}.ctx div{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mnb{display:flex;gap:6px;padding:0 12px 6px;overflow-x:auto}.mnb button{padding:5px 12px;border-radius:99px;background:var(--panel);font-weight:700;flex:none}
.opts{display:grid;gap:6px}.opts button{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:var(--bg);font-weight:700;text-align:left}
.opts span:last-child{min-width:0;overflow:hidden;text-overflow:ellipsis}
.ems{display:flex;justify-content:space-between;margin-bottom:10px}.ems button{font-size:25px;width:46px;height:46px;border-radius:50%;background:var(--bg)}
.pbg{position:fixed;inset:0;z-index:60;background:rgba(10,15,18,.5);backdrop-filter:blur(6px);animation:fade .15s}
@keyframes fade{from{opacity:0}}
.row.lift{position:relative;z-index:61;animation:none}
.ppill,.pmenu{position:fixed;z-index:62;background:var(--panel);box-shadow:var(--shadow);animation:zoom .18s cubic-bezier(.2,.9,.3,1)}
@keyframes zoom{from{opacity:0;transform:scale(.86)}}
.ppill{display:flex;gap:2px;padding:6px;border-radius:99px}
.ppill button{width:44px;height:44px;border-radius:50%;font-size:26px;line-height:1;transition:transform .12s}
.ppill button:active{transform:scale(1.28)}.ppill button.mine{background:var(--out)}
.pmenu{width:min(250px,calc(100vw - 24px));border-radius:26px;padding:6px}
.pmenu button{display:flex;align-items:center;gap:12px;width:100%;padding:8px 10px;border-radius:20px;font-weight:700;text-align:left}
.pmenu button:active{background:var(--line)}
.pmenu button .mi{width:34px;height:34px;border-radius:13px;background:var(--bg);color:var(--acc);display:grid;place-items:center;font-size:20px}
.pmenu button.danger{color:#c0392b}.pmenu button.danger .mi{color:#c0392b;background:rgba(192,57,43,.12)}
.err{color:#c0392b;font-weight:700;font-size:13.5px;min-height:20px;margin-bottom:8px}
.cta{width:100%;padding:14px;border-radius:99px;background:var(--acc);color:#fff;font-weight:800;font-size:16px}
.cta:disabled{opacity:.6}
.fine{margin-top:16px;text-align:center;font-size:12.5px;color:var(--mute)}
/* chat-type chooser */
.pick .card{padding-bottom:22px}
.pick .sub{margin-bottom:18px}
.pk{display:flex;align-items:center;gap:14px;width:100%;padding:12px 14px;margin-bottom:10px;border-radius:24px;background:var(--bg);text-align:left;transition:transform .12s}
.pk:active{transform:scale(.98)}
.pk:hover{box-shadow:inset 0 0 0 1.5px var(--acc)}
.pk>.mi{width:48px;height:48px;border-radius:17px;background:var(--acc);color:#fff;display:grid;place-items:center;font-size:25px;flex:none}
.pk>.av{width:48px;height:48px;font-size:18px}
.pk.on>.av::after{content:"";position:absolute;right:-1px;bottom:-1px;width:12px;height:12px;border-radius:50%;background:#3fae6a;border:2.5px solid var(--bg)}
.pk.off{opacity:.6}
.pk>span:not(.mi){flex:1;min-width:0;font-weight:800;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pk small{display:block;color:var(--mute);font-weight:600;font-size:12.5px;white-space:normal}
.plist{max-height:44dvh;overflow:auto;margin:0 -4px;padding:0 4px}
.pback{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;margin-top:4px;padding:11px;border-radius:99px;font-weight:800;color:var(--mute)}
.pback:hover{background:var(--line);color:var(--ink)}
.sh .ib{margin-left:auto}
.pkgap{display:none}
@media(max-width:899px){
html,body{overscroll-behavior:none}
.pick{padding:0;place-items:stretch;background:var(--bg)}
.pick .card{width:100%;border-radius:0;box-shadow:none;background:var(--bg);display:flex;flex-direction:column;padding:calc(40px + var(--sat)) 24px calc(24px + var(--sab));animation:fade .2s}
.pick .logo{width:72px;height:72px;border-radius:25px;margin-bottom:26px}
.pick .logo .mi{font-size:36px}
.pick h1{font-size:36px}
.pick .sub{font-size:16px;margin-bottom:22px}
.pkgap{display:block;flex:1}
.pk{padding:16px;border-radius:28px;background:var(--panel);box-shadow:0 1px 2px var(--line)}
.pk>.mi,.pk>.av{width:56px;height:56px}
.pk>.mi{border-radius:20px;font-size:28px}
.pk>.av{font-size:20px}
.pk>span:not(.mi){font-size:18px}
.pk small{font-size:13.5px}
.pk.on>.av::after{border-color:var(--panel)}
.plist{flex:1;max-height:none;min-height:0}
.pback{margin-top:8px;padding:14px}
.app.on{animation:fade .2s}
.login{padding:0;place-items:stretch;background:var(--bg)}
.login .card{width:100%;border-radius:0;box-shadow:none;background:var(--bg);display:flex;flex-direction:column;padding:calc(40px + var(--sat)) 24px calc(24px + var(--sab));animation:fade .2s}
.login .logo{width:72px;height:72px;border-radius:25px;margin-bottom:26px}
.login .logo .mi{font-size:36px}
.login h1{font-size:36px}
.login .sub{font-size:16px;margin-bottom:26px}
.login label{font-size:14px;margin-bottom:16px}
.login input:not([type=checkbox]){background:var(--panel);padding:16px 18px;border-radius:20px;box-shadow:0 1px 2px var(--line)}
.login .err{margin-top:auto;padding-top:8px}
.login .cta{padding:17px;font-size:17px}
.login .fine{margin-top:14px}}
@media(pointer:coarse){.b{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}.b pre,.b code{-webkit-user-select:text;user-select:text}}
/* app */
.app{display:none;height:100dvh;max-width:1180px;margin:0 auto}
.app.on{display:flex}
.side{width:300px;flex:none;background:var(--panel);display:flex;flex-direction:column;border-right:1px solid var(--line)}
.sh{padding:calc(18px + var(--sat)) 20px 10px;display:flex;align-items:center;gap:12px}
.sh .logo{width:40px;height:40px;border-radius:14px;margin:0}.sh .logo .mi{font-size:22px}
.sh b{font-size:17px;display:block;line-height:1.2}.sh small{color:var(--mute);font-size:12.5px}
.mem{flex:1;overflow:auto;padding:6px 10px}
.m{display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:18px}
.m:hover{background:var(--line)}.m.off{opacity:.55}
.m span{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.m small{display:block;color:var(--mute);font-weight:600;font-size:12px}
.av{width:34px;height:34px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;font-weight:800;font-size:14px;position:relative}
.av.ghost{background:none!important}
.m .av{width:42px;height:42px}
.m.on .av::after{content:"";position:absolute;right:-1px;bottom:-1px;width:12px;height:12px;border-radius:50%;background:#3fae6a;border:2.5px solid var(--panel)}
.sf{padding:10px 12px calc(12px + var(--sab));display:flex;gap:6px;border-top:1px solid var(--line)}
.sf button{flex:1;display:flex;gap:8px;align-items:center;justify-content:center;padding:10px;border-radius:99px;background:var(--bg);font-weight:700;font-size:13.5px}
.main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative;background:var(--bg)}
.top{display:flex;align-items:center;gap:6px;padding:calc(8px + var(--sat)) 10px 8px 14px;background:var(--panel);border-bottom:1px solid var(--line)}
.ttl{flex:1;min-width:0}.ttl b{font-size:17px;display:block;line-height:1.25}
.ttl small{color:var(--mute);font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:#b9a27a;flex:none}.dot.ok{background:#3fae6a}
.only-m{display:none}
.msgs{flex:1;overflow-y:auto;padding:12px 14px 6px;overscroll-behavior:contain}
.day{width:max-content;margin:14px auto 8px;padding:3px 14px;border-radius:99px;background:var(--panel);color:var(--mute);font-size:12px;font-weight:700}
.sys{text-align:center;color:var(--mute);font-size:12.5px;font-weight:600;margin:8px 0}
.empty{text-align:center;color:var(--mute);margin:12vh auto 0;max-width:260px}
.empty .mi{font-size:44px;color:var(--acc);display:block;margin-bottom:6px}
.row{display:flex;align-items:flex-end;gap:8px;margin-top:2px;animation:pop .18s ease-out}
.row.first{margin-top:10px}.row.me{justify-content:flex-end}
@keyframes pop{from{opacity:0;transform:translateY(6px) scale(.98)}}
.b{max-width:min(80%,580px);min-width:0;padding:7px 13px 6px;border-radius:22px;background:var(--in);box-shadow:0 1px 1px var(--line);overflow-wrap:anywhere}
.row:not(.me) .b{border-bottom-left-radius:7px}
.me .b{background:var(--out);color:var(--outk);border-bottom-right-radius:7px}
.nm{font-size:12.5px;font-weight:800}
.tx{white-space:pre-wrap}
.t{float:right;margin:7px 0 0 12px;font-size:11px;color:var(--mute)}
.b::after{content:"";display:block;clear:both}
.b a{color:var(--acc);font-weight:700}
code{font-family:'JetBrains Mono',monospace;font-size:.86em;background:var(--line);padding:1px 6px;border-radius:8px}
.code{margin:6px 0;border-radius:18px;overflow:hidden;background:#151b1f;color:#dce5e8;max-width:100%}
.ch{display:flex;justify-content:space-between;align-items:center;padding:6px 8px 6px 14px;background:#1d252a;color:#9fb0b8;font:700 12px 'JetBrains Mono',monospace}
.ch button{padding:4px 13px;border-radius:99px;background:rgba(255,255,255,.09);color:#dce5e8;font:800 12px Nunito;margin-left:6px}
.ch button[data-a=run]{background:var(--acc);color:#fff}
.code pre{padding:12px 14px;overflow:auto;max-height:300px;font:500 12.5px/1.65 'JetBrains Mono',monospace}
.typing{height:22px;padding:0 20px;font-size:12.5px;font-weight:700;color:var(--acc)}
.fab{position:absolute;right:16px;bottom:96px;width:44px;height:44px;border-radius:50%;background:var(--panel);box-shadow:var(--shadow);display:none;place-items:center;color:var(--acc)}
.fab.on{display:grid}
.fab i{position:absolute;top:-6px;right:-4px;min-width:20px;height:20px;border-radius:10px;background:var(--acc);color:#fff;font:800 11px/20px Nunito;text-align:center;padding:0 5px}
.comp{display:flex;gap:8px;align-items:flex-end;padding:4px 12px calc(10px + var(--sab))}
.field{flex:1;display:flex;align-items:flex-end;background:var(--panel);border-radius:26px;padding:3px 4px 3px 16px;box-shadow:0 1px 2px var(--line)}
.field textarea{flex:1;min-width:0;border:0;outline:0;resize:none;background:none;color:var(--ink);font:600 16px/1.45 Nunito,sans-serif;padding:10px 0;max-height:140px}
.field textarea::placeholder{color:var(--mute);font-weight:600}
.send{width:48px;height:48px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center;flex:none}
.send:active{transform:scale(.92)}
.bg{position:fixed;inset:0;background:rgba(10,15,18,.5);display:none;align-items:flex-end;justify-content:center;z-index:50}
.bg.on{display:flex}
.sheet{width:min(580px,100%);background:var(--panel);border-radius:30px 30px 0 0;padding:20px 20px calc(20px + var(--sab));animation:up .25s cubic-bezier(.2,.9,.3,1);max-height:90dvh;overflow:auto}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet h3{font-size:17px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.url{background:var(--bg);padding:10px 14px;border-radius:16px;font:500 12px 'JetBrains Mono',monospace;word-break:break-all;margin-bottom:12px}
.res{padding:12px 14px;border-radius:16px;margin-bottom:12px;font-weight:600}
.res.good{background:rgba(63,174,106,.15)}.res.bad{background:rgba(192,57,43,.14)}.res.warn{background:rgba(185,162,122,.2)}
.acts{display:flex;gap:8px}
.acts button{flex:1;padding:12px;border-radius:99px;background:var(--bg);font-weight:800}
.acts .p{background:var(--acc);color:#fff}
.pv{width:100%;height:55dvh;border:0;border-radius:18px;background:#fff}
.toast{position:fixed;left:50%;bottom:calc(90px + var(--sab));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-weight:700;font-size:13.5px;z-index:80;animation:pop .2s}
.scrim{display:none}
@media(min-width:900px){body{padding:20px}.app{height:calc(100dvh - 40px);border-radius:34px;overflow:hidden;box-shadow:var(--shadow)}.bg{align-items:center}.sheet{border-radius:30px}.toast{bottom:100px}}
@media(max-width:899px){
.only-m{display:grid}
.side{position:fixed;inset:0 auto 0 0;width:min(330px,86vw);z-index:40;transform:translateX(-105%);transition:transform .28s cubic-bezier(.2,.9,.3,1);border-radius:0 30px 30px 0;box-shadow:var(--shadow)}
.side.open{transform:none}
.scrim.on{display:block;position:fixed;inset:0;background:rgba(10,15,18,.45);z-index:35}
.b{max-width:86%}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="login" id="login">
 <form class="card" id="form">
  <div class="logo"><span class="mi">forum</span></div>
  <h1>AADAmeet</h1>
  <p class="sub">A private lab for design talk, code and quick experiments.</p>
  <label>Your name<input id="dn" maxlength="24" autocomplete="nickname" placeholder="What should the lab call you?" required></label>
  <label>Username<input id="un" autocomplete="username" required></label>
  <label>Password<span class="pw"><input id="pw" type="password" autocomplete="current-password" required><button type="button" class="ib eye" id="eye" aria-label="Show password"><span class="mi">visibility</span></button></span></label>
  <label>Room key (optional)<input id="rk" type="password" autocomplete="off" placeholder="Shared secret to encrypt the group chat"></label>
  <label class="chk"><input type="checkbox" id="rm"> Remember my name and username</label>
  <p class="err" id="err" role="alert"></p>
  <button class="cta" id="go">Enter the lab</button>
  <p class="fine">Encrypted connection · your password is never saved</p>
 </form>
</div>

<div class="login pick" id="pick" style="display:none">
 <div class="card" id="pickc"></div>
</div>

<div class="app" id="app">
 <aside class="side" id="side">
  <div class="sh"><div class="logo"><span class="mi">forum</span></div><div><b>Discussion Lab</b><small id="cnt">0 online</small></div><button class="ib" id="home" aria-label="Change chat type" title="Change chat type"><span class="mi">swap_horiz</span></button></div>
  <div class="mem" id="mem"></div>
  <div class="sf">
   <button id="bell"><span class="mi">notifications_active</span>Alerts</button>
   <button id="theme"><span class="mi">dark_mode</span>Theme</button>
   <button id="leave"><span class="mi">logout</span>Leave</button>
  </div>
 </aside>
 <div class="scrim" id="scrim"></div>
 <main class="main">
  <header class="top">
   <button class="ib" id="back" aria-label="Back to chat types" title="Back"><span class="mi">arrow_back</span></button>
   <button class="ib only-m" id="menu" aria-label="Members"><span class="mi">groups</span></button>
   <div class="ttl"><b id="tt">Discussion Lab</b><small><i class="dot" id="dot"></i><span id="sub">Connecting…</span></small></div>
   <button class="ib" id="clear" aria-label="Clear my view" title="Clear my view"><span class="mi">cleaning_services</span></button>
  </header>
  <div class="pinbar" id="pinbar" style="display:none"><span class="mi">push_pin</span><span id="pint"></span></div>
  <div class="msgs" id="msgs"></div>
  <button class="fab" id="fab" aria-label="Jump to latest"><span class="mi">keyboard_arrow_down</span></button>
  <div class="typing" id="typing"></div>
  <div class="mnb" id="mnb" style="display:none"></div>
  <div class="ctx" id="ctx"><div id="ctxt"></div><button class="ib" id="ctxx" aria-label="Cancel"><span class="mi">close</span></button></div>
  <div class="comp">
   <div class="field">
    <textarea id="in" rows="1" placeholder="Share an idea, critique or snippet…" aria-label="Message"></textarea>
    <button class="ib" id="attach" aria-label="Attach file" title="Send a file"><span class="mi">attach_file</span></button>
    <input type="file" id="fi" style="display:none">
    <button class="ib" id="code" aria-label="Insert code block" title="Code block"><span class="mi">code</span></button>
   </div>
   <button class="send" id="send" aria-label="Send"><span class="mi">send</span></button>
  </div>
 </main>
</div>

<div class="bg" id="bg"><div class="sheet"><h3><span id="sht"></span><button class="ib" id="shx" aria-label="Close"><span class="mi">close</span></button></h3><div id="shb"></div></div></div>

/* files: sliced into byte chunks, sent over MQTT, rebuilt and hash-checked on arrival */
const safeName=s=>String(s||'file').replace(/[\\/:*?"<>|\x00-\x1f]/g,'_').slice(0,80)||'file';
const fmtSize=n=>n<1024?n+' B':n<1048576?(n/1024).toFixed(1)+' KB':(n/1048576).toFixed(2)+' MB';
const maxChunks=()=>Math.ceil(CFG.fmax/CFG.fchunk);
function longAsFile(v){if(confirm('That message is over '+CFG.max+' characters. Send it as a text file instead?'))sendFile(new File([v],'snippet.txt',{type:'text/plain'}))}
async function sendFile(file){
 if(!client?.connected)return toast('Offline. Reconnecting…');
 if(!file.size)return toast('That file is empty.');
 if(file.size>CFG.fmax)return toast('Files can be up to '+fmtSize(CFG.fmax)+'.');
 const dm=cur!=='lab',key=dm?await peerKey(cur):rkey;
 if(dm&&!key)return toast('They have not opened the updated app yet, so there is no key to encrypt with.');
 const buf=await file.arrayBuffer(),size=buf.byteLength,n=Math.ceil(size/CFG.fchunk),id=myId+'-'+Date.now().toString(36),name=safeName(file.name),
  h=crypto.subtle?b64(await crypto.subtle.digest('SHA-256',buf)):'';
 fx[id]={parts:{},got:n,meta:{n,name,size,h},blob:new Blob([buf])};
 if(!await send('::file::'+JSON.stringify({id,name,size,n,h,g:dm?0:1})))return;
 const to=dm?cur:'lab';
 try{for(let i=0;i<n;i++){
  const raw=b64(buf.slice(i*CFG.fchunk,(i+1)*CFG.fchunk)),pl=key?await enc(key,raw):raw;
  await new Promise((ok,no)=>client.publish(CFG.file+to+'/'+id+'/'+i,pl,{qos:1,retain:true},e=>e?no(e):ok()));
  toast('Sending '+name+' · '+Math.round((i+1)/n*100)+'%')}}
 catch{toast('File sending was interrupted. Try again.')}
 setTimeout(()=>clearChunks(id,n,to),36e5)}
async function onChunk(topic,txt){
 if(!txt)return;
 const[,,to,fid,ix]=topic.split('/'),i=+ix;
 if(!fid||!/^[\w-]+$/.test(fid)||!(i>=0&&i<maxChunks()))return;
 if(!fx[fid]&&Object.keys(fx).length>60)return;
 const f=fx[fid]||(fx[fid]={parts:{},got:0});if(f.parts[i]!==undefined)return;
 try{const key=to==='lab'?rkey:await peerKey(fid.slice(0,fid.lastIndexOf('-')));const b=key?await dec(key,txt):txt;
  if(b.length>CFG.fchunk*1.4)return;f.parts[i]=b;f.got++}catch{f.bad=1}
 fileUI(fid)}
function fileCard(txt){
 let m;try{m=JSON.parse(txt.slice(8))}catch{}
 if(!m||!/^[\w-]+$/.test(m.id||'')||!(m.size>0&&m.size<=CFG.fmax)||m.n!==Math.ceil(m.size/CFG.fchunk))return null;
 const f=fx[m.id]||(fx[m.id]={parts:{},got:0});f.meta={n:m.n,name:safeName(m.name),size:m.size,h:typeof m.h==='string'?m.h:'',g:m.g?1:0};
 const d=el('file');d.dataset.f=m.id;d.innerHTML='<span class="mi">description</span><div><b></b><small></small></div><button>Save</button>';
 d.querySelector('b').textContent=f.meta.name;d.querySelector('button').onclick=()=>fx[m.id].blob&&!fx[m.id].err?dl(m.id):fetchFile(m.id);
 setTimeout(()=>{if(!f.blob&&!f.sub&&Date.now()-curTs<12e4)fetchFile(m.id);fileUI(m.id)},0);return d}
async function finish(id){
 const f=fx[id];if(f.chk)return;f.chk=1;const bytes=[];
 for(let i=0;i<f.meta.n;i++){if(f.parts[i]===undefined){f.chk=0;return}bytes.push(unb(f.parts[i]))}
 const blob=new Blob(bytes,{type:'application/octet-stream'});
 if(f.meta.h&&crypto.subtle&&b64(await crypto.subtle.digest('SHA-256',await blob.arrayBuffer()))!==f.meta.h)f.err=1;
 f.blob=blob;unfetch(id);fileUI(id)}
const ftopic=(id,m)=>CFG.file+(m.g?'lab':myId)+'/'+id+'/';
function fetchFile(id){const f=fx[id];if(!f?.meta||!client?.connected)return toast('Offline. Reconnecting…');
 if(f.err){f.parts={};f.got=0;f.blob=null;f.err=0;f.chk=0}
 f.sub=1;f.stall=0;client.subscribe(ftopic(id,f.meta)+'+',{qos:1});track(id);fileUI(id)}
function repair(id){const f=fx[id],t=[];for(let i=0;i<f.meta.n;i++)if(f.parts[i]===undefined)t.push(ftopic(id,f.meta)+i);
 if(t.length&&client?.connected){client.subscribe(t,{qos:1});setTimeout(()=>client?.unsubscribe(t),5000)}}
function track(id){const f=fx[id];clearInterval(f.iv);let last=-1,tries=0;

  if(f.got===last){if(++tries>3){clearInterval(f.iv);f.stall=1;fileUI(id);return}repair(id)}else tries=0;last=f.got},4000)}
function unfetch(id){const f=fx[id];if(f?.sub&&client?.connected)client.unsubscribe(ftopic(id,f.meta)+'+');if(f)f.sub=0}
